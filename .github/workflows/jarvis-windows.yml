name: Jarvis Windows (installateur et mise à jour)

# À chaque envoi sur main : fabrique l'installateur Windows et le publie comme
# nouvelle version (onglet « Releases »). Les Jarvis installés la téléchargent
# seuls et l'installent au redémarrage suivant.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/jarvis-windows.yml"

permissions:
  contents: write

jobs:
  installateur:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @muscu/jarvis-desktop typecheck
      - name: Numéro de version
        shell: pwsh
        working-directory: apps/jarvis-desktop
        run: npm version "0.3.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - name: Installateur
        working-directory: apps/jarvis-desktop
        run: node build.mjs && npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-installation
          path: apps/jarvis-desktop/release/*.exe
          retention-days: 30
      - name: Publication (onglet Releases, lue par les mises à jour automatiques)
        shell: pwsh
        working-directory: apps/jarvis-desktop/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "0.3.${{ github.run_number }}"
          gh release create "v$version" (Get-ChildItem -File | Where-Object { $_.Name -match '\.(exe|blockmap|yml)$' -and $_.Name -notmatch 'uninstaller|builder-debug' } | ForEach-Object { $_.FullName }) --target "${{ github.sha }}" --title "Jarvis $version" --notes "Installateur Windows de Jarvis $version. Les Jarvis déjà installés se mettent à jour tout seuls."
