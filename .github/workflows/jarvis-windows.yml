name: Jarvis Windows (installateur et mise à jour)

# À chaque envoi sur main : fabrique l'installateur Windows et le publie comme
# nouvelle version (onglet « Releases »). Les Jarvis installés la téléchargent
# seuls et l'installent au redémarrage suivant.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/jarvis-windows.yml"

permissions:
  contents: write

jobs:
  installateur:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @muscu/jarvis-desktop typecheck
      - name: Numéro de version
        shell: pwsh
        working-directory: apps/jarvis-desktop
        run: npm version "0.3.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - name: Installateur
        working-directory: apps/jarvis-desktop
        run: node build.mjs && npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Test de démarrage (rien n'est publié si Jarvis ne démarre pas)
        shell: pwsh
        working-directory: apps/jarvis-desktop
        run: |
          $env:JARVIS_TEST_DEMARRAGE = "1"
          $env:JARVIS_WORKSPACE = Join-Path $env:RUNNER_TEMP "jarvis-test"
          $out = Join-Path $env:RUNNER_TEMP "demarrage.log"
          $err = Join-Path $env:RUNNER_TEMP "demarrage-erreurs.log"
          $p = Start-Process -FilePath "release/win-unpacked/Jarvis.exe" -ArgumentList "--hidden" -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(180000)) {
            Stop-Process -Id $p.Id -Force
            Get-Content $out, $err -ErrorAction SilentlyContinue | Select-Object -Last 60
            Write-Error "Jarvis ne s'est pas fermé en 3 minutes (bloqué au démarrage)."
            exit 1
          }
          Get-Content $out, $err -ErrorAction SilentlyContinue | Select-String "\[test\]|Error|ÉCHEC" | Select-Object -Last 40
          if ($p.ExitCode -ne 0) { Write-Error "Le test de démarrage a échoué (code $($p.ExitCode))."; exit 1 }
          $marker = Join-Path $env:JARVIS_WORKSPACE "test-demarrage.txt"
          if (-not (Test-Path $marker)) { Write-Error "Jarvis n'a pas confirmé son démarrage."; exit 1 }
          Get-Content $marker
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-installation
          path: apps/jarvis-desktop/release/*.exe
          retention-days: 30
      - name: Publication (onglet Releases, lue par les mises à jour automatiques)
        shell: pwsh
        working-directory: apps/jarvis-desktop/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "0.3.${{ github.run_number }}"
          gh release create "v$version" (Get-ChildItem -File | Where-Object { $_.Name -match '\.(exe|blockmap|yml)$' -and $_.Name -notmatch 'uninstaller|builder-debug' } | ForEach-Object { $_.FullName }) --target "${{ github.sha }}" --title "Jarvis $version" --notes "Installateur Windows de Jarvis $version. Les Jarvis déjà installés se mettent à jour tout seuls."
